name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($v -match '^(\d+)\.(\d+)\.0$') { $tag = "v$($Matches[1]).$($Matches[2])" }
          else { $tag = "v$v" }
          gh release view $tag --json id *> $null
          $exists = ($LASTEXITCODE -eq 0)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=VFX Player $tag" >> $env:GITHUB_OUTPUT
          if ($exists) { $ex = "true" } else { $ex = "false" }
          "exists=$ex" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag exists=$ex"
          exit 0

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.exists != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.exists != 'true'
        with:
          shared-key: release-windows

      - name: Install ffmpeg
        if: steps.ver.outputs.exists != 'true'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe |
            Where-Object { $_.Length -gt 1MB } | Select-Object -First 1
          if (-not $real) { throw "real ffmpeg.exe not found under chocolatey lib" }
          "FFMPEG_EXE=$($real.FullName)" >> $env:GITHUB_ENV
          Write-Host "FFMPEG_EXE=$($real.FullName) ($([math]::Round($real.Length/1MB)) MB)"

      - name: Build
        if: steps.ver.outputs.exists != 'true'
        run: cargo build --release

      - name: Publish
        if: steps.ver.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "target/release/vfx_editor.exe" `
            --title "${{ steps.ver.outputs.name }}" `
            --notes "Windows x64. Download ``vfx_editor.exe`` — no installer, FFmpeg is bundled." `
            --latest
