<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VFX Player</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
        background: #1b1b1b;
        color: #d2d2d2;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }
      h1 {
        margin: 0 0 8px;
        color: #f2f2f2;
        font-weight: 600;
      }
      .sub {
        color: #b8b8b8;
        margin: 0 0 20px;
      }
      img {
        width: 100%;
        height: auto;
        border-radius: 8px;
      }
      .dl {
        display: inline-block;
        margin: 0 12px 20px 0;
        padding: 10px 16px;
        background: #208c78;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
      }
      a.gh {
        color: #8ec8ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VFX Player</h1>
      <p class="sub">
        Advanced Video Player for VFX Experts. Frame-accurate review, not a
        consumer player. No installer.
      </p>
      <p>
        <a
          class="dl"
          href="https://github.com/GroophyLifefor/vfx-editor/releases/latest/download/vfx_editor.exe"
          >Download vfx_editor.exe</a
        >
        <a class="gh" href="https://github.com/GroophyLifefor/vfx-editor"
          >GitHub</a
        >
      </p>
      <p><img src="screenshot.png" alt="VFX Player" /></p>
      <p>
        Windows x64. FFmpeg and yt-dlp bundled. First launch: Türkçe / English.
      </p>
      <p>
        Made by
        <a class="gh" href="https://github.com/GroophyLifefor">Murat Kirazkaya</a>
      </p>
    </main>
  </body>
</html>
